---
name: KSAI

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

jobs:
  ksai:
    name: run
    uses: Kong/ksai-public/.github/workflows/ksai.yml@b42798a3956961d79a2e0092fa3002ec55565310 # v5.1.0
    permissions:
      contents: read   # checked out by every command; a push uses the token CP mints
      id-token: write  # mint the GitHub OIDC token for the Kong gateway
